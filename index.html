<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocabulary Games</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --text: #1f2937;
      --success: #10b981;
      --error: #ef4444;
      --reset-bg: #64748b;
      --reset-hover: #475569;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 650px;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      margin-top: 0;
      color: var(--primary);
    }

    /* Score Board y botón de reset */
    .score-board {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 20px;
      font-size: 0.9rem;
    }

    .score-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid #e2e8f0;
    }

    .score-header span {
      font-weight: bold;
      color: var(--primary);
    }

    .btn-reset {
      background: var(--reset-bg);
      color: white;
      border: none;
      border-radius: 4px;
      padding: 5px 10px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-reset:hover {
      background: var(--reset-hover);
    }

    .score-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px dashed #e2e8f0;
    }

    .score-row:last-child {
      border-bottom: none;
      font-weight: bold;
      margin-top: 4px;
      padding-top: 8px;
      border-top: 2px solid #cbd5e1;
    }

    .score-correct { color: var(--success); }
    .score-incorrect { color: var(--error); }

    .nav {
      display: flex;
      gap: 5px;
      margin-bottom: 20px;
    }

    .nav button {
      flex: 1;
      padding: 8px 4px;
      border: 2px solid var(--primary);
      background: transparent;
      color: var(--primary);
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .nav button.active {
      background: var(--primary);
      color: white;
    }

    .game-card {
      display: none;
    }

    .game-card.active {
      display: block;
    }

    .prompt-box {
      background: #eef2ff;
      padding: 16px;
      border-radius: 8px;
      font-weight: 500;
      margin-bottom: 16px;
      font-size: 1.1rem;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 1rem;
      box-sizing: border-box;
      margin-bottom: 12px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .option-btn {
      padding: 12px;
      border: 1px solid #d1d5db;
      background: white;
      border-radius: 6px;
      text-align: left;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.2s;
    }

    .option-btn:hover {
      background: #f9fafb;
    }

    .btn-submit, .btn-next {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-submit:hover, .btn-next:hover {
      background: var(--primary-hover);
    }

    .result-box {
      margin-top: 16px;
      padding: 16px;
      border-radius: 8px;
      display: none;
    }

    .result-box.correct {
      background: #ecfdf5;
      border: 1px solid var(--success);
      color: #065f46;
    }

    .result-box.incorrect {
      background: #fef2f2;
      border: 1px solid var(--error);
      color: #991b1b;
    }

    .solution-details {
      margin-top: 10px;
      font-size: 0.9rem;
      background: rgba(255, 255, 255, 0.7);
      padding: 10px;
      border-radius: 6px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Vocabulary Games</h1>

  <!-- Score Board con botón de Reset -->
  <div class="score-board">
    <div class="score-header">
      <span>Scoreboard</span>
      <button class="btn-reset" onclick="resetStats()">Reset Counters</button>
    </div>
    <div class="score-row">
      <span>Game 1: Guess the Word</span>
      <span>Correct: <strong id="g1-correct" class="score-correct">0</strong> | Incorrect: <strong id="g1-incorrect" class="score-incorrect">0</strong></span>
    </div>
    <div class="score-row">
      <span>Game 2: Guess the Definition</span>
      <span>Correct: <strong id="g2-correct" class="score-correct">0</strong> | Incorrect: <strong id="g2-incorrect" class="score-incorrect">0</strong></span>
    </div>
    <div class="score-row">
      <span>Game 3: Word from Definition</span>
      <span>Correct: <strong id="g3-correct" class="score-correct">0</strong> | Incorrect: <strong id="g3-incorrect" class="score-incorrect">0</strong></span>
    </div>
    <div class="score-row">
      <span>Total Combined</span>
      <span>Correct: <strong id="total-correct" class="score-correct">0</strong> | Incorrect: <strong id="total-incorrect" class="score-incorrect">0</strong></span>
    </div>
  </div>

  <div id="app">
    <div class="nav">
      <button id="nav-g1" class="active" onclick="switchGame(1)">1. Guess Word</button>
      <button id="nav-g2" onclick="switchGame(2)">2. Guess Def.</button>
      <button id="nav-g3" onclick="switchGame(3)">3. Word from Def.</button>
    </div>

    <!-- GAME 1 -->
    <div id="game1" class="game-card active">
      <div class="prompt-box" id="g1-prompt"></div>
      <input type="text" id="g1-input" placeholder="Type the word in English..." onkeydown="if(event.key==='Enter') checkGame1()">
      <button id="g1-submit" class="btn-submit" onclick="checkGame1()">Submit</button>
      
      <div id="g1-result" class="result-box">
        <div id="g1-status"></div>
        <div class="solution-details" id="g1-solution"></div>
        <br>
        <button class="btn-next" onclick="nextGame1()">Next Word</button>
      </div>
    </div>

    <!-- GAME 2 -->
    <div id="game2" class="game-card">
      <div class="prompt-box" id="g2-prompt"></div>
      <div id="g2-options" class="options-grid"></div>
      
      <div id="g2-result" class="result-box">
        <div id="g2-status"></div>
        <div class="solution-details" id="g2-solution"></div>
        <br>
        <button class="btn-next" onclick="nextGame2()">Next Question</button>
      </div>
    </div>

    <!-- GAME 3 -->
    <div id="game3" class="game-card">
      <div class="prompt-box" id="g3-prompt"></div>
      <div id="g3-options" class="options-grid"></div>
      
      <div id="g3-result" class="result-box">
        <div id="g3-status"></div>
        <div class="solution-details" id="g3-solution"></div>
        <br>
        <button class="btn-next" onclick="nextGame3()">Next Question</button>
      </div>
    </div>
  </div>
</div>

    document.getElementById('g3-correct').innerText = stats.g3.correct;
    document.getElementById('g3-incorrect').innerText = stats.g3.incorrect;

    const totalCorrect = stats.g1.correct + stats.g2.correct + stats.g3.correct;
    const totalIncorrect = stats.g1.incorrect + stats.g2.incorrect + stats.g3.incorrect;

    document.getElementById('total-correct').innerText = totalCorrect;
    document.getElementById('total-incorrect').innerText = totalIncorrect;
  }

  // Función para resetear todos los contadores
  function resetStats() {
    stats = {
      g1: { correct: 0, incorrect: 0 },
      g2: { correct: 0, incorrect: 0 },
      g3: { correct: 0, incorrect: 0 }
    };
    updateScoreDisplay();
  }

  function switchGame(gameNum) {
    document.getElementById('nav-g1').classList.toggle('active', gameNum === 1);
    document.getElementById('nav-g2').classList.toggle('active', gameNum === 2);
    document.getElementById('nav-g3').classList.toggle('active', gameNum === 3);
    
    document.getElementById('game1').classList.toggle('active', gameNum === 1);
    document.getElementById('game2').classList.toggle('active', gameNum === 2);
    document.getElementById('game3').classList.toggle('active', gameNum === 3);
  }

  function getRandomRow() {
    return vocabulary[Math.floor(Math.random() * vocabulary.length)];
  }

  // --- GAME 1 ---
  function nextGame1() {
    currentG1Row = getRandomRow();
    document.getElementById('g1-prompt').innerText = currentG1Row.col2;
    document.getElementById('g1-input').value = '';
    document.getElementById('g1-input').disabled = false;
    document.getElementById('g1-submit').style.display = 'block';
    document.getElementById('g1-result').style.display = 'none';
  }

  function checkGame1() {
    const userInput = document.getElementById('g1-input').value.trim().toLowerCase();
    const target = currentG1Row.col1.toLowerCase();
    const isCorrect = userInput === target;

    if (isCorrect) stats.g1.correct++; else stats.g1.incorrect++;
    updateScoreDisplay();

    const resultBox = document.getElementById('g1-result');
    resultBox.className = 'result-box ' + (isCorrect ? 'correct' : 'incorrect');
    document.getElementById('g1-status').innerHTML = isCorrect ? '<strong>Correct!</strong>' : '<strong>Incorrect.</strong>';

    document.getElementById('g1-solution').innerHTML = `
      <strong>Word:</strong> ${currentG1Row.col1}<br>
      <strong>Definition:</strong> ${currentG1Row.col2}<br>
      <strong>Translation:</strong> ${currentG1Row.col3}
    `;

    document.getElementById('g1-input').disabled = true;
    document.getElementById('g1-submit').style.display = 'none';
    resultBox.style.display = 'block';
  }

  // --- GAME 2 ---
  function nextGame2() {
    currentG2Row = getRandomRow();
    document.getElementById('g2-prompt').innerText = `What is the definition of: "${currentG2Row.col1}"?`;

    const options = [currentG2Row.col2];
    while (options.length < 4 && vocabulary.length >= 4) {
      const randomRow = getRandomRow();
      if (!options.includes(randomRow.col2)) {
        options.push(randomRow.col2);
      }
    }

    options.sort(() => Math.random() - 0.5);

    const optionsContainer = document.getElementById('g2-options');
    optionsContainer.innerHTML = '';
    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerText = opt;
      btn.onclick = () => checkGame2(opt);
      optionsContainer.appendChild(btn);
    });

    document.getElementById('g2-result').style.display = 'none';
  }

  function checkGame2(selectedOption) {
    const isCorrect = selectedOption === currentG2Row.col2;

    if (isCorrect) stats.g2.correct++; else stats.g2.incorrect++;
    updateScoreDisplay();

    const resultBox = document.getElementById('g2-result');
    resultBox.className = 'result-box ' + (isCorrect ? 'correct' : 'incorrect');
    document.getElementById('g2-status').innerHTML = isCorrect ? '<strong>Correct!</strong>' : '<strong>Incorrect.</strong>';

    document.getElementById('g2-solution').innerHTML = `
      <strong>Word:</strong> ${currentG2Row.col1}<br>
      <strong>Definition:</strong> ${currentG2Row.col2}<br>
      <strong>Translation:</strong> ${currentG2Row.col3}
    `;

    document.querySelectorAll('#g2-options .option-btn').forEach(btn => btn.disabled = true);
    resultBox.style.display = 'block';
  }

  // --- GAME 3 ---
  function nextGame3() {
    currentG3Row = getRandomRow();
    document.getElementById('g3-prompt').innerText = `Which word matches this definition:\n\n"${currentG3Row.col2}"?`;

    const options = [currentG3Row.col1];
    while (options.length < 4 && vocabulary.length >= 4) {
      const randomRow = getRandomRow();
      if (!options.includes(randomRow.col1)) {
        options.push(randomRow.col1);
      }
    }

    options.sort(() => Math.random() - 0.5);

    const optionsContainer = document.getElementById('g3-options');
    optionsContainer.innerHTML = '';
    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerText = opt;
      btn.onclick = () => checkGame3(opt);
      optionsContainer.appendChild(btn);
    });

    document.getElementById('g3-result').style.display = 'none';
  }

  function checkGame3(selectedOption) {
    const isCorrect = selectedOption === currentG3Row.col1;

    if (isCorrect) stats.g3.correct++; else stats.g3.incorrect++;
    updateScoreDisplay();

    const resultBox = document.getElementById('g3-result');
    resultBox.className = 'result-box ' + (isCorrect ? 'correct' : 'incorrect');
    document.getElementById('g3-status').innerHTML = isCorrect ? '<strong>Correct!</strong>' : '<strong>Incorrect.</strong>';

    document.getElementById('g3-solution').innerHTML = `
      <strong>Word:</strong> ${currentG3Row.col1}<br>
      <strong>Definition:</strong> ${currentG3Row.col2}<br>
      <strong>Translation:</strong> ${currentG3Row.col3}
    `;

    document.querySelectorAll('#g3-options .option-btn').forEach(btn => btn.disabled = true);
    resultBox.style.display = 'block';
  }

  // Initialize games
  nextGame1();
  nextGame2();
  nextGame3();
</script>

</body>
</html>
